<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">IDK Advanced R&amp;D</title>
<desc id="desc">Clean IDK Advanced R&amp;D wordmark with an engineering waveform accent</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071c32"/>
    <stop offset="0.58" stop-color="#0b68bd"/>
    <stop offset="1" stop-color="#16c9c8"/>
  </linearGradient>
  <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0b6fd3"/>
    <stop offset="0.55" stop-color="#18d5e8"/>
    <stop offset="1" stop-color="#79ecf3"/>
  </linearGradient>
</defs>

<!-- Core IDK wordmark: intentionally clean, with no motor icon -->
<g fill="url(#brand)">
  <path d="M105 78h88v300h-88z"/>
  <path d="M225 78h232c111 0 194 62 194 150s-83 150-194 150H225V263h88v56h144c63 0 104-35 104-91s-41-91-104-91H313v56h-88z"/>
  <path d="M682 78h88v126L914 78h121L850 241l188 137H914L770 270v108h-88z"/>
</g>

<!-- Engineering waveform integrated through the D -->
<polyline points="190,228 320,228 341,179 368,286 398,218 425,248 447,228 650,228"
  fill="none" stroke="url(#signal)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Brand descriptor -->
<text x="570" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="800" letter-spacing="13" fill="#071d31">ADVANCED R&amp;D</text>
<text x="570" y="486" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="8" fill="#31566d">DRIVING A BETTER TOMORROW</text>
</svg>